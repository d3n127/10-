<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization portal · 4loopGroup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
</head>
<body class="auth t-admin">
<div class="sun-wrap" aria-hidden="true"><i class="orbit o2"></i><i class="orbit o1"></i><i class="halo"></i><i class="sun"></i></div>
<section class="auth-card" id="authCard">
<a class="back" href="index.html">← Back to roles</a><a class="logo " href="index.html"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#ffd04a" stroke-width="3" aria-hidden="true"><circle cx="11" cy="10" r="6.5"/><circle cx="29" cy="9" r="6.5"/><circle cx="11" cy="29" r="6.5"/><circle cx="29" cy="30" r="6.5"/></svg><span>4loop<b>Group</b></span></a>
<p class="eyebrow">Organization portal</p>
<h1 id="authTitle">Welcome back.</h1><p class="sub" id="authSub">Sign in to continue your campus journey.</p>
<div class="tabs" role="tablist"><button type="button" data-tab="login" class="on">Sign in</button><button type="button" data-tab="register">Create account</button></div>
<form action="admin/overview.html" id="loginForm">
<label for="l_email">University email</label><input id="l_email" type="email" value="admin@codecraft.edu" required>
<label for="l_pw">Password</label><input id="l_pw" type="password" value="password" required>
<button class="btn block" type="submit">Sign in <svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><p class="hint">Demo ready — use the prefilled details to explore.</p></form>
<form action="admin/overview.html" id="registerForm" hidden>
<label for="r_name">Full name</label><input id="r_name" placeholder="Your full name" required>
<label for="r_email">University email</label><input id="r_email" type="email" placeholder="you@university.edu" required>
<label for="r_pw">Password</label><input id="r_pw" type="password" placeholder="At least 6 characters" minlength="6" required>
<label for="r_org">Organization name</label><input id="r_org" placeholder="e.g. UIPC" required><button class="btn block" type="submit">Create account <svg class="ic " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
</section>
<div class="toast" id="toast" hidden></div>
<script src="js/site.js"></script>
</body>
</html>
